name: ASTRA X6 fence export
on:
  pull_request:
    paths: ['native/fragment-x6/**', '.github/workflows/astra-x6.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python native/fragment-x6/validate_x6.py
      - run: python native/fragment-x6/build_x6.py
      - run: git diff --exit-code -- native/fragment-x6/WpsBreachLabX6.3.cs
