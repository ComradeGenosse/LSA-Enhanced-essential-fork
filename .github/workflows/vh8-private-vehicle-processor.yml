name: VH8 private car-graphics batch processor smoke
on:
  pull_request:
    branches:
      - feature/f11-cheat-menu-favorites-20261025
      - main
    paths:
      - 'tools/vehicle-geometry/batch/**'
      - '.github/workflows/vh8-private-vehicle-processor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-car-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install private-render tool dependencies
        run: python -m pip install -r tools/vehicle-geometry/batch/requirements.txt
      - name: Test synthetic 3D GLB to local art JSON/PNG (no Rockstar assets)
        run: python -m unittest discover -s tools/vehicle-geometry/batch -p 'test_*.py' -v
