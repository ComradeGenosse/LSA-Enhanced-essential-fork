name: Destruction catalog offline prototype
on:
  pull_request:
    paths:
      - 'tools/destruction-catalog/**'
      - 'docs/next-gen-gameplay/astra-001/post-x7/**'
      - '.github/workflows/destruction-catalog.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tools/destruction-catalog -p 'test_*.py' -v
      - run: python tools/destruction-catalog/catalog.py --output /tmp/destruction-catalog.json
      - run: python native/fragment-x7/validate_x7d.py --require-exports
