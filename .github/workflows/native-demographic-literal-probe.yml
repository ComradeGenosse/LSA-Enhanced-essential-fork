name: Native demographic literal probe

on:
  workflow_dispatch:
  push:
    branches:
      - audit/native-context-evidence-20261001
    paths:
      - .github/workflows/native-demographic-literal-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build safe metadata/string probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-probe | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content native-probe/native-probe.csproj
          @'
          using System.Reflection;
          using System.Reflection.Metadata;
          using System.Reflection.Metadata.Ecma335;
          using System.Reflection.PortableExecutable;
          using System.Runtime.Loader;

          var dll = Path.GetFullPath("lsa-essential-e1-candidate/upstream/LosSantosAlive.dll");
          var constants = new uint[] {
            275379809,1029827067,1054968094,1183486338,1221715181,2568606624,
            3112276658,3265984749,3557421416,3818300071,4287505268,
            456850424,543755242,1146829187,1491984142,1902598045,2752304247,
            3002916032,3136590273,3216616699,3452035397,3823192816,3921185575,
            4017991228,3867215626,2981142090,2490659326,3393120374,1007587260,
            3409208058
          };

          using var fs = File.OpenRead(dll);
          using var pe = new PEReader(fs);
          var reader = pe.GetMetadataReader();
          var global = reader.TypeDefinitions.Select(h => (h, d: reader.GetTypeDefinition(h)))
            .First(x => reader.GetString(x.d.Name) == "<Module>");
          var tokens = global.d.GetMethods().Select(MetadataTokens.GetToken).ToArray();
          Console.WriteLine($"GLOBAL_METHODS={tokens.Length}");

          var asm = AssemblyLoadContext.Default.LoadFromAssemblyPath(dll);
          Console.WriteLine($"ASSEMBLY={asm.FullName}");
          Console.WriteLine($"MVID={asm.ManifestModule.ModuleVersionId}");
          var candidates = new List<MethodInfo>();
          foreach (var token in tokens) {
            try {
              var mb = asm.ManifestModule.ResolveMethod(token);
              if (mb is not MethodInfo m || !m.IsGenericMethodDefinition || m.GetGenericArguments().Length != 1) continue;
              var p = m.GetParameters();
              if (p.Length == 1 && p[0].ParameterType == typeof(uint)) {
                candidates.Add(m);
                Console.WriteLine($"DECRYPTOR token=0x{token:X8} name64={Convert.ToBase64String(System.Text.Encoding.UTF8.GetBytes(m.Name))}");
              }
            } catch (Exception ex) {
              Console.WriteLine($"RESOLVE_FAIL token=0x{token:X8} type={ex.GetType().Name}");
            }
          }
          Console.WriteLine($"DECRYPTOR_COUNT={candidates.Count}");
          foreach (var value in constants.Distinct()) {
            foreach (var m in candidates) {
              try {
                var s = m.MakeGenericMethod(typeof(string)).Invoke(null, new object[]{value}) as string;
                if (s != null) Console.WriteLine($"DECODE value={value} token=0x{m.MetadataToken:X8} text={Convert.ToBase64String(System.Text.Encoding.UTF8.GetBytes(s))}");
              } catch (Exception ex) {
                Console.WriteLine($"INVOKE_FAIL value={value} token=0x{m.MetadataToken:X8} type={ex.GetBaseException().GetType().Name}");
              }
            }
          }
          '@ | Set-Content native-probe/Program.cs
          dotnet run --project native-probe/native-probe.csproj -c Release | Tee-Object -FilePath demographic-literals.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-demographic-literals
          path: demographic-literals.txt
          retention-days: 7
