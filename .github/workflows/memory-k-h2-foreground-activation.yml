name: Memory K H2 independent foreground activation (offline)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/memory-k-h2-foreground-activation.yml'
      - 'lsa-essential-e1-candidate/src/**'
      - 'lsa-essential-e1-candidate/tests/memory/h2ForegroundActivation.test.mjs'
      - 'lsa-essential-e1-candidate/tests/memory/h1IndependentActivation.test.mjs'
      - 'lsa-essential-e1-candidate/tests/memory/independentForegroundMemory.test.mjs'
      - 'tools/memory-k-verification/registrations/h2-foreground-activation.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-k-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: H1/H2 original runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in lsa-essential-e1-candidate/src/memory/independentForegroundMemory.mjs lsa-essential-e1-candidate/src/memory/runtimeComposition.mjs lsa-essential-e1-candidate/src/integration/essentialGlue.mjs lsa-essential-e1-candidate/src/bootstrap.mjs lsa-essential-e1-candidate/src/openai/runSequentialTurn.mjs lsa-essential-e1-candidate/tests/memory/h2ForegroundActivation.test.mjs lsa-essential-e1-candidate/tests/memory/h1IndependentActivation.test.mjs; do node --check "$file"; done
      - name: Original runner H1-only H2-only combined and source revocation
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 lsa-essential-e1-candidate/tests/memory/independentForegroundMemory.test.mjs lsa-essential-e1-candidate/tests/memory/h2ForegroundActivation.test.mjs lsa-essential-e1-candidate/tests/memory/h1IndependentActivation.test.mjs lsa-essential-e1-candidate/tests/memory/h1ConversationHistoryHardening.test.mjs 2>&1 | tee "$RUNNER_TEMP/h1h2-activation.log"
      - name: Independent H2 M4 evidence and original WS6 regression
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 lsa-essential-e1-candidate/tests/memory/h2FactualRecall.test.mjs lsa-essential-e1-candidate/tests/memory/h2RealAuthority.test.mjs lsa-essential-e1-candidate/tests/memory/ws6OriginalRunner.test.mjs lsa-essential-e1-candidate/tests/memory/ws6ProductionPipeline.test.mjs lsa-essential-e1-candidate/tests/memory/d03OriginalDialogueJoin.test.mjs lsa-essential-e1-candidate/tests/memory/d01OpenAIAcceptance.test.mjs 2>&1 | tee "$RUNNER_TEMP/h1h2-regressions.log"
      - name: Strict registered test inventory
        shell: bash
        run: |
          set -euo pipefail
          node --test tools/memory-k-verification/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/h1h2-inventory.log"
      - name: Preserve raw offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h1h2-original-runner-${{ matrix.os }}
          path: ${{ runner.temp }}/h1h2-*.log
