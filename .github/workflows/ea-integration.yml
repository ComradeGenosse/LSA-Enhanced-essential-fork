name: Emotional Acting EA0-EA4 Integration

on:
  push:
    branches:
      - integration/elevenlabs-emotional-acting-ea0-ea4-20261011
  pull_request:
    branches:
      - plan/elevenlabs-v4-emotional-acting-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: EA0-EA4 targeted tests, provider regression and streaming safety
        working-directory: lsa-essential-e1-candidate
        run: >
          node --test
          tests/elevenlabs-emotional-acting.test.mjs
          tests/scene-delivery.test.mjs
          tests/ea-integration-owner-projection.test.mjs
          tests/ea2-speech-delivery.test.mjs
          tests/ea2-turn-lifecycle.test.mjs
          tests/ea3-delivery-hints.test.mjs
          tests/emotional-mood-continuity.test.mjs
          tests/elevenlabs-provider.test.mjs
          tests/streaming-decision.test.mjs
          tests/decisions-and-requests.test.mjs
      - name: Compile native C05 test helper required by the full suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet build native/activities/tests/ActivityTests.csproj --configuration Debug
      - name: All Essential Node tests (no billable provider requests)
        working-directory: lsa-essential-e1-candidate
        env:
          LSA_CI_FAILURE_DETAILS: '1'
        run: npm test
