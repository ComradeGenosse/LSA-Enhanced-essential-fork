name: Memory K G independent witnessed events and coverage
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [integration/memory-k-production-20261012]
    paths:
      - 'lsa-essential-e1-candidate/**'
      - 'lsa-shared-brain/**'
      - 'tools/memory-k-verification/**'
      - '.github/workflows/memory-k-g-independent-events.yml'
      - 'docs/plans/memory-k-g-independent-events-20261015.md'
  workflow_dispatch:
permissions:
  contents: read
# Supersede old runs for this workflow and PR without cancelling other checks.
concurrency:
  group: memory-k-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Independent G (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Authenticated G modes, privacy, lifecycle and 2500-event stress
        shell: bash
        run: |
          mkdir -p work/g-focused
          node -e 'const fs=require("node:fs"),cp=require("node:child_process");fs.writeFileSync("work/g-focused/meta.json",JSON.stringify({head:cp.execFileSync("git",["rev-parse","HEAD"],{encoding:"utf8"}).trim(),node:process.version,platform:process.platform},null,2))'
          node --import ./tools/memory-k-verification/offline.mjs --test --test-reporter=tap --test-concurrency=1 lsa-essential-e1-candidate/tests/memory-g-bootstrap.test.mjs lsa-essential-e1-candidate/tests/memory-g-independent-events.test.mjs > work/g-focused/g.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-g-focused-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: work/g-focused
  g:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81b8ac51a3ac370acf3d70ebf9538c8f1ffbd9a6
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # The unchanged Windows D2 Node test executes IntegrationTests.exe;
      # compile/run its original native prerequisite before invoking Node.
      - name: Original native D2 policy and Windows wire/host suites
        if: always()
        working-directory: candidate
        run: node tools/memory-k-verification/g-native.mjs --baseline ../baseline --output work/g-validation/native
      - name: Identical original M3 PS1 PS2 D1 D2 P2 E2 baseline comparison
        if: always()
        working-directory: candidate
        run: node tools/memory-k-verification/g-suite.mjs --original-only --baseline ../baseline --output work/g-validation
      - name: Original source-verified offline builders on both revisions
        if: always()
        shell: bash
        run: |
          mkdir -p candidate/work/g-validation/build
          cd baseline
          baseline_status=0
          node lsa-essential-e1-candidate/tools/buildCandidate.mjs > ../candidate/work/g-validation/build/baseline.log 2>&1 || baseline_status=$?
          cd ../candidate
          candidate_status=0
          node lsa-essential-e1-candidate/tools/buildCandidate.mjs > work/g-validation/build/candidate.log 2>&1 || candidate_status=$?
          echo "baseline=$baseline_status candidate=$candidate_status" > work/g-validation/build/status.txt
          test "$baseline_status" -eq 0 && test "$candidate_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-g-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate/work/g-validation
