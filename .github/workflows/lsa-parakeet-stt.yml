name: Parakeet Ultra STT Focused Validation

on:
  pull_request:
    branches:
      - main
      - feature/faster-qwen3-tts-provider-radio-v2
    paths:
      - 'lsa-essential-e1-candidate/src/providers/**'
      - 'lsa-essential-e1-candidate/src/config/e1Config.mjs'
      - 'lsa-essential-e1-candidate/src/observability/eventContract.mjs'
      - 'lsa-essential-e1-candidate/tools/stt/**'
      - 'lsa-essential-e1-candidate/tests/parakeet-provider.test.mjs'
      - '.github/workflows/lsa-parakeet-stt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-stt:
    name: Offline STT and compatibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check standalone Photon sidecar syntax
        working-directory: lsa-essential-e1-candidate
        run: python -m py_compile tools/stt/parakeet_server.py
      - name: Run offline STT and provider-contract tests
        working-directory: lsa-essential-e1-candidate
        run: node --test tests/parakeet-provider.test.mjs tests/provider-contract.test.mjs
