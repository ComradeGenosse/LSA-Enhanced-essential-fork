name: Standalone Phase 4 Native Audio

on:
  pull_request:
    branches:
      - feature/standalone-phase3-typed-turn
      - feature/standalone-phase4-audio-escrow
      - main
    paths:
      - 'native/standalone/**'
      - 'native/standalone-host/**'
      - 'lsa-standalone-companion/**'
      - 'docs/standalone-replacement/**'
      - '.github/workflows/standalone-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native PCM, conversation and transport tests
        run: node --test lsa-standalone-companion/tests/*.test.mjs
      - name: Validate Qwen sidecar Python syntax without downloading models
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('lsa-standalone-companion/tools/qwen/lsa_qwen_server.py').read_text(encoding='utf-8'))"

  net481-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release compile and real native authority simulation
        shell: pwsh
        run: |
          dotnet build native/standalone/LSA.Standalone.Core.csproj -f net481 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/standalone/tests/LSA.Standalone.Core.Tests.csproj -f net10.0 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile real net481 host and test harness (no GTA deployment)
        shell: pwsh
        run: |
          dotnet build native/standalone-host/tests/FakeRphSdk.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stub = (Resolve-Path 'native/standalone-host/tests/bin/Release/net481/RagePluginHook.dll').Path
          dotnet build native/standalone-host/LSA.Standalone.RageHost.csproj -c Release "-p:RphReferencePath=$stub"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/standalone-host/tests/Phase2PipeHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore native/standalone-host/tests/RealRphReference.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.nuget/packages/ragepluginhook/1.124.0') -Filter RagePluginHook.dll -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk) { throw 'Official RPH reference unavailable' }
          dotnet build native/standalone-host/LSA.Standalone.RageHost.csproj -c Release "-p:RphReferencePath=$sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native typed replies and exact PCM escrow over real net481 IPC
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'native/standalone-host/tests/bin/Release/net481/Phase2PipeHarness.exe').Path
          foreach ($mode in @('direct_fixture','loopback_responses','pcm_escrow','pcm_rolling','tts_http','qwen_http','early_speech','physical_receipt')) {
            # Each mode gets its own genuine native host process and lease;
            # no cancelled native turn is silently replayed between fixtures.
            $hostProcess = Start-Process -FilePath $exe -PassThru
            try {
              $ok = $false
              for ($attempt = 1; $attempt -le 12; $attempt++) {
                if ($mode -eq 'physical_receipt') {
                  node lsa-standalone-companion/tools/physical-playback-pipe-fixture.mjs
                } elseif ($mode -eq 'early_speech') {
                  node lsa-standalone-companion/tools/early-speech-fixture.mjs
                } elseif ($mode -eq 'qwen_http') {
                  node lsa-standalone-companion/tools/audio-qwen-http-fixture.mjs
                } elseif ($mode -eq 'tts_http') {
                  node lsa-standalone-companion/tools/audio-tts-http-fixture.mjs
                } elseif ($mode -eq 'pcm_rolling') {
                  node lsa-standalone-companion/tools/audio-rolling-fixture.mjs
                } elseif ($mode -eq 'pcm_escrow') {
                  node lsa-standalone-companion/tools/audio-escrow-fixture.mjs
                } elseif ($mode -eq 'loopback_responses') {
                  node lsa-standalone-companion/tools/typed-turn-fixture.mjs --http-stub
                } else {
                  node lsa-standalone-companion/tools/typed-turn-fixture.mjs
                }
                if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                Start-Sleep -Milliseconds 250
              }
              if (-not $ok) { throw "Typed turn interop failed: $mode" }
            } finally {
              Stop-Process -Id $hostProcess.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $hostProcess.Id -Timeout 5 -ErrorAction SilentlyContinue
            }
          }
