name: Standalone Phase 4 Native Audio

on:
  push:
    branches:
      - feature/standalone-gta-typed-smoke-gate
    paths:
      - 'native/standalone/**'
      - 'native/standalone-host/**'
      - 'lsa-standalone-companion/**'
      - 'docs/standalone-replacement/**'
      - 'tools/standalone-gta-smoke/**'
      - '.github/workflows/standalone-phase4.yml'
  pull_request:
    branches:
      - feature/standalone-phase3-typed-turn
      - feature/standalone-phase4-audio-escrow
      - feature/standalone-s3-waveout-playback
      - feature/standalone-gta-typed-smoke-gate
      - main
    paths:
      - 'native/standalone/**'
      - 'native/standalone-host/**'
      - 'lsa-standalone-companion/**'
      - 'docs/standalone-replacement/**'
      - 'tools/standalone-gta-smoke/**'
      - '.github/workflows/standalone-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

# A pull_request workflow checks out refs/pull/*/merge by default.
# Every asserted build, checksum and artifact must instead correspond to
# the exact standalone integration branch head, never a synthetic merge SHA.
env:
  STANDALONE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  node-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STANDALONE_BUILD_SHA }}
      - name: Require exact standalone PR head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$STANDALONE_BUILD_SHA" || {
            echo "::error::Wrong checkout SHA: $actual"; exit 1;
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native PCM, conversation and transport tests
        run: node --test lsa-standalone-companion/tests/*.test.mjs
      - name: Validate Qwen sidecar Python syntax without downloading models
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('lsa-standalone-companion/tools/qwen/lsa_qwen_server.py').read_text(encoding='utf-8'))"

  net481-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STANDALONE_BUILD_SHA }}
      - name: Require exact standalone PR head
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$STANDALONE_BUILD_SHA" || {
            echo "::error::Wrong checkout SHA: $actual"; exit 1;
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release compile and real native authority simulation
        shell: pwsh
        run: |
          dotnet build native/standalone/LSA.Standalone.Core.csproj -f net481 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/standalone/tests/LSA.Standalone.Core.Tests.csproj -f net10.0 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile real net481 host and test harness (no GTA deployment)
        shell: pwsh
        run: |
          dotnet build native/standalone-host/tests/FakeRphSdk.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stub = (Resolve-Path 'native/standalone-host/tests/bin/Release/net481/RagePluginHook.dll').Path
          dotnet build native/standalone-host/LSA.Standalone.RageHost.csproj -c Release "-p:RphReferencePath=$stub"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/standalone-host/tests/Phase2PipeHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore native/standalone-host/tests/RealRphReference.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.nuget/packages/ragepluginhook/1.124.0') -Filter RagePluginHook.dll -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk) { throw 'Official RPH reference unavailable' }
          # CRITICAL: MSBuild may consider the prior fake-SDK build up-to-date
          # even though RphReferencePath changed. Force a clean real-SDK compile
          # so ONLY this binary, not the fake-SDK output, is packaged for GTA.
          dotnet build native/standalone-host/LSA.Standalone.RageHost.csproj -c Release -t:Rebuild "-p:RphReferencePath=$sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/standalone-host/tests/RphSignatureAudit.csproj -c Release -- "$sdk" "native/standalone-host/bin/Release/net481/LSA.Standalone.RageHost.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native typed replies and exact PCM escrow over real net481 IPC
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'native/standalone-host/tests/bin/Release/net481/Phase2PipeHarness.exe').Path
          foreach ($mode in @('direct_fixture','loopback_responses','pcm_escrow','pcm_rolling','tts_http','qwen_http','early_speech','physical_receipt')) {
            # Each mode gets its own genuine native host process and lease;
            # no cancelled native turn is silently replayed between fixtures.
            $hostProcess = Start-Process -FilePath $exe -PassThru
            try {
              $ok = $false
              for ($attempt = 1; $attempt -le 12; $attempt++) {
                if ($mode -eq 'physical_receipt') {
                  node lsa-standalone-companion/tools/physical-playback-pipe-fixture.mjs
                } elseif ($mode -eq 'early_speech') {
                  node lsa-standalone-companion/tools/early-speech-fixture.mjs
                } elseif ($mode -eq 'qwen_http') {
                  node lsa-standalone-companion/tools/audio-qwen-http-fixture.mjs
                } elseif ($mode -eq 'tts_http') {
                  node lsa-standalone-companion/tools/audio-tts-http-fixture.mjs
                } elseif ($mode -eq 'pcm_rolling') {
                  node lsa-standalone-companion/tools/audio-rolling-fixture.mjs
                } elseif ($mode -eq 'pcm_escrow') {
                  node lsa-standalone-companion/tools/audio-escrow-fixture.mjs
                } elseif ($mode -eq 'loopback_responses') {
                  node lsa-standalone-companion/tools/typed-turn-fixture.mjs --http-stub
                } else {
                  node lsa-standalone-companion/tools/typed-turn-fixture.mjs
                }
                if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                Start-Sleep -Milliseconds 250
              }
              if (-not $ok) { throw "Typed turn interop failed: $mode" }
            } finally {
              Stop-Process -Id $hostProcess.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $hostProcess.Id -Timeout 5 -ErrorAction SilentlyContinue
            }
          }
      - name: Assemble isolated GTA smoke-test bundle (NO RPH/Essential redistribution)
        shell: pwsh
        run: |
          $root = 'out/lsa-standalone-gta-smoke'
          New-Item -ItemType Directory -Force "$root/payload" | Out-Null
          New-Item -ItemType Directory -Force "$root/companion" | Out-Null
          Copy-Item 'native/standalone-host/bin/Release/net481/LSA.Standalone.RageHost.dll' "$root/payload/"
          Copy-Item 'native/standalone/bin/Release/net481/LSA.Standalone.Core.dll' "$root/payload/"
          Set-Content -Path "$root/payload/LSA.Standalone.enabled" -Value "Explicit isolated test profile only." -Encoding UTF8
          Copy-Item 'lsa-standalone-companion/src' "$root/companion/src" -Recurse
          New-Item -ItemType Directory -Force "$root/companion/tools" | Out-Null
          Copy-Item 'lsa-standalone-companion/tools/activation-config.mjs' "$root/companion/tools/"
          Copy-Item 'lsa-standalone-companion/service.mjs' "$root/companion/"
          Copy-Item 'lsa-standalone-companion/package.json' "$root/companion/"
          Copy-Item 'tools/standalone-gta-smoke/*.ps1' "$root/"
          Copy-Item 'tools/standalone-gta-smoke/README.md' "$root/"
          if ((git rev-parse HEAD).Trim() -ne $env:STANDALONE_BUILD_SHA) {
            throw 'Artifact not built from the exact standalone branch head'
          }
          Set-Content -LiteralPath "$root/BUILD_SHA.txt" -Value $env:STANDALONE_BUILD_SHA -Encoding ascii
          Copy-Item 'docs/standalone-replacement/modular-activation-testing.md' "$root/"
          if (-not (Test-Path "$root/companion/src/conversation/typedRuntime.mjs")) {
            throw 'Node companion source tree absent from bundle'
          }
          node --check "$root/companion/service.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged standalone Node syntax failed' }
          node --check "$root/companion/tools/activation-config.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged activation preflight syntax failed' }
          node "$root/companion/tools/activation-config.mjs" host | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packaged safe host activation preflight failed' }
          foreach ($script in Get-ChildItem -LiteralPath $root -Filter '*.ps1' -File) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if (@($parseErrors).Count -gt 0) { throw "PowerShell syntax invalid: $($script.Name)" }
          }
          $manifest = Get-ChildItem -LiteralPath $root -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace('\','/')
            "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $relative"
          }
          $manifest | Set-Content "$root/SHA256SUMS.txt" -Encoding ascii
          $zip = 'out/lsa-standalone-gta-smoke.zip'
          Compress-Archive -Path "$root/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Bundle creation failed' }
      - name: Verify launcher stages and physical opt-in without launching GTA
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/lsa-standalone-gta-smoke').Path
          $game = Join-Path $env:RUNNER_TEMP 'standalone-activation-preflight-fixture'
          New-Item -ItemType Directory -Force "$game/.LSAStandaloneSmoke" | Out-Null
          Set-Content "$game/RAGEPluginHook.exe" 'fixture only'
          Set-Content "$game/.LSAStandaloneSmoke/manifest.json" '{}'
          # Seed unsafe inherited values; preflight must override them only in
          # its child configuration, and restore every original caller value.
          $env:LSA_STANDALONE_ACTOR_MODE='experimental'
          $env:LSA_STANDALONE_AUDIO_OUTPUT='waveout_experimental'
          $env:LSA_STANDALONE_TTS_MODE='enabled'
          $env:LSA_STANDALONE_ACTIVATION_STAGE='original-session'
          $env:LSA_STANDALONE_MODEL='original-model'
          $env:LSA_STANDALONE_VOICE_ASSIGNMENTS='C:\\stale-previous-launch.json'
          $env:LSA_STANDALONE_TTS_SESSION_VOICES='stalevoice'
          $env:LSA_STANDALONE_TTS_INSTRUCTIONS='stale instructions from previous launch'
          $env:LSA_STANDALONE_QWEN_VOICES='stale-qwen-voices'
          $tracked=@('LSA_STANDALONE_ACTOR_MODE','LSA_STANDALONE_AUDIO_OUTPUT',
            'LSA_STANDALONE_TTS_MODE','LSA_STANDALONE_TYPED_MODE',
            'LSA_STANDALONE_PLAYBACK_CONFIRM','LSA_STANDALONE_LIPSYNC',
            'LSA_STANDALONE_EARLY_SPEECH','LSA_STANDALONE_MODEL',
            'LSA_STANDALONE_TTS_MODEL','LSA_STANDALONE_TTS_PROVIDER',
            'LSA_STANDALONE_TTS_VOICE','LSA_STANDALONE_QWEN_URL',
            'LSA_STANDALONE_QWEN_VOICES','LSA_STANDALONE_ACTIVATION_STAGE',
            'LSA_STANDALONE_VOICE_ASSIGNMENTS','LSA_STANDALONE_TTS_SESSION_VOICES',
            'LSA_STANDALONE_TTS_INSTRUCTIONS')
          $baseline=@{}
          foreach ($key in $tracked) {
            $baseline[$key]=[Environment]::GetEnvironmentVariable($key,'Process')
          }
          function Assert-CleanPreflight {
            foreach ($key in $tracked) {
              $actual=[Environment]::GetEnvironmentVariable($key,'Process')
              if ($actual -cne $baseline[$key]) {
                throw "Standalone preflight leaked activation setting: $key"
              }
            }
          }
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage host -PreflightOnly
          Assert-CleanPreflight
          if (Test-Path "$game/.LSAStandaloneSmoke/native-activation.json") {
            throw 'Dry-run unexpectedly created GTA native activation file'
          }
          $env:OPENAI_API_KEY='ci-fixture-only'
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage typed -Model ci-test -PreflightOnly
          Assert-CleanPreflight
          $automationDenied = $false
          try {
            & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage typed -Model ci-test -AutoSmoke -PreflightOnly
          } catch { $automationDenied = $_.Exception.Message -like '*ConfirmAutomatedActorAdoption*' }
          if (-not $automationDenied) { throw 'Automated actor adoption did not require opt-in' }
          Assert-CleanPreflight
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage typed -Model ci-test -AutoSmoke -AutoDelaySeconds 30 -ConfirmAutomatedActorAdoption -PreflightOnly
          Assert-CleanPreflight
          if (Test-Path "$game/.LSAStandaloneSmoke/native-activation.json") {
            throw 'Automated smoke dry-run unexpectedly created native configuration'
          }
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage streaming -Model ci-test -TtsModel ci-tts -PreflightOnly
          Assert-CleanPreflight
          # Inherited voice/assignment/instruction flags must not poison OpenAI
          # or local Qwen staged preflight, and must survive unaltered in caller.
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage tts -Model ci-test -TtsModel ci-tts -PreflightOnly
          Assert-CleanPreflight
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage tts -Model ci-test -TtsProvider faster-qwen3-tts -Voice alloy -PreflightOnly
          Assert-CleanPreflight
          $rejected = $false
          try {
            & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage audio -Model ci-test -TtsModel ci-tts -PreflightOnly
          } catch { $rejected = $_.Exception.Message -like '*ConfirmPhysicalEffects*' }
          if (-not $rejected) { throw 'Experimental output accepted without explicit consent' }
          Assert-CleanPreflight
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage audio -Model ci-test -TtsModel ci-tts -ConfirmPhysicalEffects -PreflightOnly
          Assert-CleanPreflight
          & "$root/Start-Standalone-Test.ps1" -GamePath $game -Stage streaming -Model ci-test -TtsModel ci-tts -EnableCapability physical_audio,lip_sync -ConfirmPhysicalEffects -AutoSmoke -ConfirmAutomatedActorAdoption -PreflightOnly
          Assert-CleanPreflight
          & "$root/Run-Standalone-AutoSmoke.ps1" -GamePath $game -Model ci-test -TtsModel ci-tts -ConfirmPhysicalEffects -ConfirmAutomatedActorAdoption -PreflightOnly
          Assert-CleanPreflight
          Remove-Item Env:OPENAI_API_KEY
      - name: Prove create-only deploy, legacy exclusion and exact rollback offline
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'isolated-gta-smoke-fixture'
          New-Item -ItemType Directory -Force "$fixture/Plugins" | Out-Null
          Set-Content "$fixture/GTA5_Enhanced.exe" 'not a real game'
          Set-Content "$fixture/RAGEPluginHook.exe" 'not a real loader'
          Set-Content "$fixture/Plugins/LosSantosAlive.dll" 'legacy marker'
          $root = (Resolve-Path 'out/lsa-standalone-gta-smoke').Path
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $fixture -IsolatedProfile }
          catch { $denied = $true }
          if (-not $denied) { throw 'Legacy coexistence was not rejected' }
          Remove-Item "$fixture/Plugins/LosSantosAlive.dll"
          & "$root/Install-Standalone.ps1" -GamePath $fixture -IsolatedProfile
          if (-not (Test-Path "$fixture/Plugins/LSA.Standalone.RageHost.dll")) {
            throw 'Host deployment missing'
          }
          # Tampering must fail atomically, without deleting any other
          # installed managed file or manifest. Restore known bundle bytes.
          Set-Content "$fixture/Plugins/LSA.Standalone.RageHost.dll" 'tampered'
          $tamperDenied = $false
          try { & "$root/Undo-Standalone.ps1" -GamePath $fixture }
          catch { $tamperDenied = $true }
          if (-not $tamperDenied -or
              -not (Test-Path "$fixture/Plugins/LSA.Standalone.enabled")) {
            throw 'Tampered rollback was not safely rejected'
          }
          Copy-Item "$root/payload/LSA.Standalone.RageHost.dll" "$fixture/Plugins/LSA.Standalone.RageHost.dll" -Force
          # A launcher crash can leave a recognized activation file behind,
          # even if GTA never got far enough to load the plugin.
          @{
            kind='lsa-standalone-native-activation'
            version=1
            stage='host'
            ownerPid=999999
            createdAtUtc=[DateTime]::UtcNow.ToString('o')
            settings=@{ LSA_STANDALONE_ACTOR_MODE='off' }
          } | ConvertTo-Json -Depth 5 | Set-Content "$fixture/.LSAStandaloneSmoke/native-activation.json"
          & "$root/Undo-Standalone.ps1" -GamePath $fixture
          if ((Test-Path "$fixture/Plugins/LSA.Standalone.RageHost.dll") -or
              (Test-Path "$fixture/Plugins/LSA.Standalone.enabled") -or
              (Test-Path "$fixture/.LSAStandaloneSmoke")) {
            throw 'Rollback failed to remove managed files'
          }
      - name: Prove existing-install opt-in, legacy preflight and untouched private data
        shell: pwsh
        run: |
          $root = (Resolve-Path 'out/lsa-standalone-gta-smoke').Path
          $game = Join-Path $env:RUNNER_TEMP 'existing-gta-smoke-fixture'
          $saved = Join-Path $env:RUNNER_TEMP 'legacy-lsa-existing-smoke-backup'
          New-Item -ItemType Directory -Force "$game/Plugins/LosSantosAliveServer", "$game/Plugins/LosSantosAlive", "$game/Plugins/LSPDFR", $saved | Out-Null
          Set-Content "$game/GTA5_Enhanced.exe" 'fixture only'
          Set-Content "$game/RAGEPluginHook.exe" 'fixture only'
          Set-Content "$game/Plugins/LosSantosAliveServer/.env" 'fixture-private-config'
          Set-Content "$game/Plugins/LosSantosAlive/LosSantosAlive.config" 'fixture-original-settings'
          Set-Content "$game/Plugins/LosSantosAlive.dll" 'fixture-original-dll'
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $game } catch { $denied = $true }
          if (-not $denied) { throw 'No-mode installation was accepted' }
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $game -IsolatedProfile -ExistingInstallation } catch { $denied = $true }
          if (-not $denied) { throw 'Ambiguous deployment modes were accepted' }
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $game -ExistingInstallation } catch { $denied = $_.Exception.Message -like '*Legacy LSA conflict*' }
          if (-not $denied) { throw 'Existing installation with Essential DLL was accepted' }
          Move-Item "$game/Plugins/LosSantosAlive.dll" "$saved/LosSantosAlive.dll"
          Set-Content "$game/Plugins/LSPDFR/LosSantosAlive.PRBridge.dll" 'fixture-old-bridge'
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $game -ExistingInstallation } catch { $denied = $_.Exception.Message -like '*Legacy LSA conflict*' }
          if (-not $denied) { throw 'Old LSPDFR bridge was accepted' }
          Move-Item "$game/Plugins/LSPDFR/LosSantosAlive.PRBridge.dll" "$saved/LosSantosAlive.PRBridge.dll"
          # A renamed .NET Essential controller is still a competing owner.
          # Verify assembly metadata rather than trusting a changed filename.
          $disguised = Join-Path $game 'Plugins/OldPluginDisguised.dll'
          $fakeDir = Join-Path $env:RUNNER_TEMP 'lsa-managed-identity-fixture'
          New-Item -ItemType Directory -Force $fakeDir | Out-Null
          Set-Content -LiteralPath (Join-Path $fakeDir 'Legacy.csproj') -Value '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><AssemblyName>LosSantosAlive</AssemblyName></PropertyGroup></Project>'
          'public sealed class OldLsaTestController {}' | Set-Content (Join-Path $fakeDir 'OldController.cs')
          dotnet build (Join-Path $fakeDir 'Legacy.csproj') -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Managed legacy fixture compilation failed' }
          Copy-Item (Join-Path $fakeDir 'bin/Release/net10.0/LosSantosAlive.dll') $disguised
          $internalName = [System.Reflection.AssemblyName]::GetAssemblyName($disguised).Name
          if ($internalName -cne 'LosSantosAlive') { throw 'Wrong managed legacy fixture assembly identity' }
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $game -ExistingInstallation }
          catch { $denied = $_.Exception.Message -like '*Legacy LSA conflict*' }
          if (-not $denied) { throw 'Renamed managed legacy controller bypassed exclusion' }
          Remove-Item $disguised
          & "$root/Install-Standalone.ps1" -GamePath $game -ExistingInstallation
          if (-not (Test-Path "$game/Plugins/LSA.Standalone.RageHost.dll")) { throw 'Standalone host missing' }
          $manifest = Get-Content "$game/.LSAStandaloneSmoke/manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.profileMode -ne 'existing') { throw 'Wrong manifest profile mode' }
          Copy-Item "$saved/LosSantosAlive.dll" "$game/Plugins/LosSantosAlive.dll"
          $denied = $false
          try { & "$root/Start-Standalone-Test.ps1" -GamePath $game -Model 'test-model' } catch { $denied = $_.Exception.Message -like '*Legacy LSA conflict*' }
          if (-not $denied) { throw 'Launcher accepted a restored Essential DLL alongside standalone' }
          & "$root/Undo-Standalone.ps1" -GamePath $game
          if ((Test-Path "$game/Plugins/LSA.Standalone.RageHost.dll") -or
              (Test-Path "$game/.LSAStandaloneSmoke")) { throw 'Rollback left standalone files' }
          if ((Get-Content "$game/Plugins/LosSantosAliveServer/.env" -Raw).Trim() -ne 'fixture-private-config' -or
              (Get-Content "$game/Plugins/LosSantosAlive/LosSantosAlive.config" -Raw).Trim() -ne 'fixture-original-settings' -or
              (Get-Content "$game/Plugins/LosSantosAlive.dll" -Raw).Trim() -ne 'fixture-original-dll') {
            throw 'Existing legacy files or private data were modified'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-gta-smoke-${{ env.STANDALONE_BUILD_SHA }}
          path: out/lsa-standalone-gta-smoke.zip
          if-no-files-found: error
          retention-days: 7
