name: Standalone Phase 4 Native Audio

on:
  pull_request:
    branches:
      - feature/standalone-phase3-typed-turn
      - feature/standalone-phase4-audio-escrow
      - feature/standalone-s3-waveout-playback
      - main
    paths:
      - 'native/standalone/**'
      - 'native/standalone-host/**'
      - 'lsa-standalone-companion/**'
      - 'docs/standalone-replacement/**'
      - 'tools/standalone-gta-smoke/**'
      - '.github/workflows/standalone-phase4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native PCM, conversation and transport tests
        run: node --test lsa-standalone-companion/tests/*.test.mjs
      - name: Validate Qwen sidecar Python syntax without downloading models
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('lsa-standalone-companion/tools/qwen/lsa_qwen_server.py').read_text(encoding='utf-8'))"

  net481-audio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release compile and real native authority simulation
        shell: pwsh
        run: |
          dotnet build native/standalone/LSA.Standalone.Core.csproj -f net481 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project native/standalone/tests/LSA.Standalone.Core.Tests.csproj -f net10.0 -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile real net481 host and test harness (no GTA deployment)
        shell: pwsh
        run: |
          dotnet build native/standalone-host/tests/FakeRphSdk.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stub = (Resolve-Path 'native/standalone-host/tests/bin/Release/net481/RagePluginHook.dll').Path
          dotnet build native/standalone-host/LSA.Standalone.RageHost.csproj -c Release "-p:RphReferencePath=$stub"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/standalone-host/tests/Phase2PipeHarness.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore native/standalone-host/tests/RealRphReference.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.nuget/packages/ragepluginhook/1.124.0') -Filter RagePluginHook.dll -Recurse -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $sdk) { throw 'Official RPH reference unavailable' }
          dotnet build native/standalone-host/LSA.Standalone.RageHost.csproj -c Release "-p:RphReferencePath=$sdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native typed replies and exact PCM escrow over real net481 IPC
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'native/standalone-host/tests/bin/Release/net481/Phase2PipeHarness.exe').Path
          foreach ($mode in @('direct_fixture','loopback_responses','pcm_escrow','pcm_rolling','tts_http','qwen_http','early_speech','physical_receipt')) {
            # Each mode gets its own genuine native host process and lease;
            # no cancelled native turn is silently replayed between fixtures.
            $hostProcess = Start-Process -FilePath $exe -PassThru
            try {
              $ok = $false
              for ($attempt = 1; $attempt -le 12; $attempt++) {
                if ($mode -eq 'physical_receipt') {
                  node lsa-standalone-companion/tools/physical-playback-pipe-fixture.mjs
                } elseif ($mode -eq 'early_speech') {
                  node lsa-standalone-companion/tools/early-speech-fixture.mjs
                } elseif ($mode -eq 'qwen_http') {
                  node lsa-standalone-companion/tools/audio-qwen-http-fixture.mjs
                } elseif ($mode -eq 'tts_http') {
                  node lsa-standalone-companion/tools/audio-tts-http-fixture.mjs
                } elseif ($mode -eq 'pcm_rolling') {
                  node lsa-standalone-companion/tools/audio-rolling-fixture.mjs
                } elseif ($mode -eq 'pcm_escrow') {
                  node lsa-standalone-companion/tools/audio-escrow-fixture.mjs
                } elseif ($mode -eq 'loopback_responses') {
                  node lsa-standalone-companion/tools/typed-turn-fixture.mjs --http-stub
                } else {
                  node lsa-standalone-companion/tools/typed-turn-fixture.mjs
                }
                if ($LASTEXITCODE -eq 0) { $ok = $true; break }
                Start-Sleep -Milliseconds 250
              }
              if (-not $ok) { throw "Typed turn interop failed: $mode" }
            } finally {
              Stop-Process -Id $hostProcess.Id -Force -ErrorAction SilentlyContinue
              Wait-Process -Id $hostProcess.Id -Timeout 5 -ErrorAction SilentlyContinue
            }
          }
      - name: Assemble isolated GTA smoke-test bundle (NO RPH/Essential redistribution)
        shell: pwsh
        run: |
          $root = 'out/lsa-standalone-gta-smoke'
          New-Item -ItemType Directory -Force "$root/payload" | Out-Null
          New-Item -ItemType Directory -Force "$root/companion" | Out-Null
          Copy-Item 'native/standalone-host/bin/Release/net481/LSA.Standalone.RageHost.dll' "$root/payload/"
          Copy-Item 'native/standalone/bin/Release/net481/LSA.Standalone.Core.dll' "$root/payload/"
          Set-Content -Path "$root/payload/LSA.Standalone.enabled" -Value "Explicit isolated test profile only." -Encoding UTF8
          Copy-Item 'lsa-standalone-companion/src' "$root/companion/src" -Recurse
          Copy-Item 'lsa-standalone-companion/service.mjs' "$root/companion/"
          Copy-Item 'lsa-standalone-companion/package.json' "$root/companion/"
          Copy-Item 'tools/standalone-gta-smoke/*.ps1' "$root/"
          Copy-Item 'tools/standalone-gta-smoke/README.md' "$root/"
          if (-not (Test-Path "$root/companion/src/conversation/typedRuntime.mjs")) {
            throw 'Node companion source tree absent from bundle'
          }
          node --check "$root/companion/service.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged standalone Node syntax failed' }
          foreach ($script in Get-ChildItem -LiteralPath $root -Filter '*.ps1' -File) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if (@($parseErrors).Count -gt 0) { throw "PowerShell syntax invalid: $($script.Name)" }
          }
          $manifest = Get-ChildItem -LiteralPath $root -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring((Resolve-Path $root).Path.Length + 1).Replace('\','/')
            "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $relative"
          }
          $manifest | Set-Content "$root/SHA256SUMS.txt" -Encoding ascii
          $zip = 'out/lsa-standalone-gta-smoke.zip'
          Compress-Archive -Path "$root/*" -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw 'Bundle creation failed' }
      - name: Prove create-only deploy, legacy exclusion and exact rollback offline
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'isolated-gta-smoke-fixture'
          New-Item -ItemType Directory -Force "$fixture/Plugins" | Out-Null
          Set-Content "$fixture/GTA5_Enhanced.exe" 'not a real game'
          Set-Content "$fixture/RAGEPluginHook.exe" 'not a real loader'
          Set-Content "$fixture/Plugins/LosSantosAlive.dll" 'legacy marker'
          $root = (Resolve-Path 'out/lsa-standalone-gta-smoke').Path
          $denied = $false
          try { & "$root/Install-Standalone.ps1" -GamePath $fixture -IsolatedProfile }
          catch { $denied = $true }
          if (-not $denied) { throw 'Legacy coexistence was not rejected' }
          Remove-Item "$fixture/Plugins/LosSantosAlive.dll"
          & "$root/Install-Standalone.ps1" -GamePath $fixture -IsolatedProfile
          if (-not (Test-Path "$fixture/Plugins/LSA.Standalone.RageHost.dll")) {
            throw 'Host deployment missing'
          }
          # Tampering must fail atomically, without deleting any other
          # installed managed file or manifest. Restore known bundle bytes.
          Set-Content "$fixture/Plugins/LSA.Standalone.RageHost.dll" 'tampered'
          $tamperDenied = $false
          try { & "$root/Undo-Standalone.ps1" -GamePath $fixture }
          catch { $tamperDenied = $true }
          if (-not $tamperDenied -or
              -not (Test-Path "$fixture/Plugins/LSA.Standalone.enabled")) {
            throw 'Tampered rollback was not safely rejected'
          }
          Copy-Item "$root/payload/LSA.Standalone.RageHost.dll" "$fixture/Plugins/LSA.Standalone.RageHost.dll" -Force
          & "$root/Undo-Standalone.ps1" -GamePath $fixture
          if ((Test-Path "$fixture/Plugins/LSA.Standalone.RageHost.dll") -or
              (Test-Path "$fixture/Plugins/LSA.Standalone.enabled") -or
              (Test-Path "$fixture/.LSAStandaloneSmoke")) {
            throw 'Rollback failed to remove managed files'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-gta-smoke-${{ github.sha }}
          path: out/lsa-standalone-gta-smoke.zip
          if-no-files-found: error
          retention-days: 7
