name: Memory K M7 independent runtime curation
on:
  pull_request:
    branches: [integration/memory-k-production-20261012]
    paths:
      - 'lsa-essential-e1-candidate/src/memory/m7RuntimeCuration.mjs'
      - 'lsa-essential-e1-candidate/src/memory/lunaCurationBridge.mjs'
      - 'lsa-essential-e1-candidate/src/memory/m6RuntimeRetention.mjs'
      - 'lsa-essential-e1-candidate/src/memory/runtimeComposition.mjs'
      - 'lsa-essential-e1-candidate/src/memory/capabilityPolicy.mjs'
      - 'lsa-essential-e1-candidate/src/memory/inspectorControls.mjs'
      - 'lsa-essential-e1-candidate/src/memory/inspectorUi.mjs'
      - 'lsa-essential-e1-candidate/src/bootstrap.mjs'
      - 'lsa-essential-e1-candidate/src/integration/essentialGlue.mjs'
      - 'lsa-essential-e1-candidate/tests/memory-m7-runtime-curation.test.mjs'
      - 'lsa-shared-brain/src/memory/curationSqlite.mjs'
      - 'lsa-shared-brain/src/memory/idleCurationScheduler.mjs'
      - 'lsa-shared-brain/src/characters/sqliteFoundation.mjs'
      - 'lsa-shared-brain/src/characters/sqliteProfileStore.mjs'
      - 'lsa-shared-brain/tests/memory-m7-completion.test.mjs'
      - 'docs/plans/memory-k-m7-independent-cloud-curation-20261016.md'
      - '.github/workflows/memory-k-m7-runtime-curation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: memory-k-m7-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  m7-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check M7 runtime modules
        shell: bash
        run: |
          node --check lsa-essential-e1-candidate/src/memory/m7RuntimeCuration.mjs
          node --check lsa-shared-brain/src/memory/curationSqlite.mjs
      - name: M7 independent runtime activation (real bootstrap + SQLite, fake cloud and fake native idle, offline)
        shell: bash
        run: node --test lsa-essential-e1-candidate/tests/memory-m7-runtime-curation.test.mjs
      - name: Existing M7 engine, M6 runtime, policy and composition regressions
        if: always()
        shell: bash
        run: |
          node --test lsa-shared-brain/tests/memory-m7-completion.test.mjs lsa-essential-e1-candidate/tests/memory-agent-e.test.mjs lsa-shared-brain/tests/memory-integrated-storage.test.mjs
          node --test lsa-essential-e1-candidate/tests/memory-m6-runtime-retention.test.mjs
          node --test lsa-essential-e1-candidate/tests/memory-capability-policy.test.mjs
          node --test lsa-essential-e1-candidate/tests/memory-runtime-composition.test.mjs
          node --test lsa-essential-e1-candidate/tests/memory-i2-inspector.test.mjs
          node --test tools/memory-k-verification/tests/discovery.test.mjs
