name: Qwen TTS AB Benchmark Offline Tests

on:
  pull_request:
    branches:
      - integration/radio-v2-main-ps4-20261010
      - main
      - fix/radio-hearing-retention-stability-20261011
      - feature/faster-qwen3-tts-provider-radio-v2
    paths:
      - 'lsa-essential-e1-candidate/tools/qwen/compare_tts_benchmark.mjs'
      - 'lsa-essential-e1-candidate/tools/qwen/profile_qwen_latency.mjs'
      - 'lsa-essential-e1-candidate/tests/qwen-latency-profile.test.mjs'
      - 'lsa-essential-e1-candidate/tools/qwen/lsa_qwen_server.py'
      - 'lsa-essential-e1-candidate/tests/qwen-benchmark.test.mjs'
      - 'lsa-essential-e1-candidate/tests/elevenlabs-provider.test.mjs'
      - 'lsa-essential-e1-candidate/tests/elevenlabs-smoke-benchmark.test.mjs'
      - 'lsa-essential-e1-candidate/tools/elevenlabs/voice_smoke.mjs'
      - 'lsa-essential-e1-candidate/src/providers/**'
      - '.github/workflows/lsa-qwen-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-no-network:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate benchmark script syntax
        working-directory: lsa-essential-e1-candidate
        run: node --check tools/qwen/compare_tts_benchmark.mjs
      - name: Validate Qwen profiler syntax
        working-directory: lsa-essential-e1-candidate
        run: node --check tools/qwen/profile_qwen_latency.mjs
      - name: Execute offline mocked-provider benchmark regression
        working-directory: lsa-essential-e1-candidate
        run: node --test tests/qwen-benchmark.test.mjs
      - name: ElevenLabs provider offline tests (no API calls)
        working-directory: lsa-essential-e1-candidate
        run: node --test tests/elevenlabs-provider.test.mjs
      - name: ElevenLabs repeated smoke benchmark offline tests (no billing)
        working-directory: lsa-essential-e1-candidate
        run: |
          node --check tools/elevenlabs/voice_smoke.mjs
          node --test tests/elevenlabs-smoke-benchmark.test.mjs
      - name: Execute offline Qwen profiling regression
        working-directory: lsa-essential-e1-candidate
        run: node --test tests/qwen-latency-profile.test.mjs
