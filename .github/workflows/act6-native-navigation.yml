name: ACT6 native navigation — integrated offline gates
on:
  push:
    branches:
      - fix/act6-natural-language-navigation-20261017
    paths:
      - 'native/activities/**'
      - 'native/promoted-characters/**'
      - 'lsa-essential-e1-candidate/src/activities/**'
      - 'lsa-essential-e1-candidate/src/openai/runSequentialTurn.mjs'
      - 'lsa-essential-e1-candidate/src/openai/{decide,segmentDecoder,streamDecision}.mjs'
      - 'lsa-essential-e1-candidate/src/context/essentialDecision.mjs'
      - 'lsa-essential-e1-candidate/src/reliability/{errorClassifier,providerExecutor,retryPolicy}.mjs'
      - 'lsa-essential-e1-candidate/tests/{decisions-and-requests,streaming-decision,reliability}.test.mjs'
      - 'lsa-essential-e1-candidate/src/characters/editorServer.mjs'
      - 'lsa-essential-e1-candidate/tests/p2-editor.test.mjs'
      - 'lsa-essential-e1-candidate/src/observability/**'
      - 'lsa-essential-e1-candidate/tests/observability.test.mjs'
      - 'lsa-essential-e1-candidate/tests/vehicle-*.test.mjs'
      - 'lsa-essential-e1-candidate/tests/activities-act*.test.mjs'
      - 'lsa-essential-e1-candidate/tests/activity-act4.test.mjs'
      - '.github/workflows/act6-native-navigation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'native/activities/**'
      - 'native/promoted-characters/**'
      - 'lsa-essential-e1-candidate/src/activities/**'
      - 'lsa-essential-e1-candidate/src/openai/runSequentialTurn.mjs'
      - 'lsa-essential-e1-candidate/src/openai/{decide,segmentDecoder,streamDecision}.mjs'
      - 'lsa-essential-e1-candidate/src/context/essentialDecision.mjs'
      - 'lsa-essential-e1-candidate/src/reliability/{errorClassifier,providerExecutor,retryPolicy}.mjs'
      - 'lsa-essential-e1-candidate/tests/{decisions-and-requests,streaming-decision,reliability}.test.mjs'
      - 'lsa-essential-e1-candidate/src/characters/editorServer.mjs'
      - 'lsa-essential-e1-candidate/tests/p2-editor.test.mjs'
      - 'lsa-essential-e1-candidate/src/observability/**'
      - 'lsa-essential-e1-candidate/tests/observability.test.mjs'
      - 'lsa-essential-e1-candidate/tests/vehicle-*.test.mjs'
      - 'lsa-essential-e1-candidate/tests/activities-act*.test.mjs'
      - '.github/workflows/act6-native-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check ACT6 and dependent ACT3–ACT5
        run: |
          node --check lsa-essential-e1-candidate/src/activities/contracts.mjs
          node --check lsa-essential-e1-candidate/src/activities/intentTemplates.mjs
          node --check lsa-essential-e1-candidate/src/activities/activityValidator.mjs
          node --check lsa-essential-e1-candidate/src/activities/activityEngine.mjs
          node --check lsa-essential-e1-candidate/src/activities/act5Dialogue.mjs
          node --check lsa-essential-e1-candidate/src/activities/navigationReadiness.mjs
          node --check lsa-essential-e1-candidate/src/characters/editorServer.mjs
          node --check lsa-essential-e1-candidate/src/activities/vehicleDrivingIntent.mjs
          node --check lsa-essential-e1-candidate/src/observability/eventContract.mjs
          node --check lsa-essential-e1-candidate/src/activities/activityKnowledge.mjs
          node --check lsa-essential-e1-candidate/src/openai/runSequentialTurn.mjs
          node --check lsa-essential-e1-candidate/src/openai/decide.mjs
          node --check lsa-essential-e1-candidate/src/openai/streamDecision.mjs
          node --check lsa-essential-e1-candidate/src/openai/segmentDecoder.mjs
          node --check lsa-essential-e1-candidate/src/context/essentialDecision.mjs
          node --check lsa-essential-e1-candidate/src/reliability/errorClassifier.mjs
      - name: ACT2–ACT6 focused regression
        run: |
          node --test --test-concurrency=1 \
            lsa-essential-e1-candidate/tests/vehicle-dll-handoff.test.mjs \
            lsa-essential-e1-candidate/tests/vehicle-driving-intent.test.mjs \
            lsa-essential-e1-candidate/tests/decisions-and-requests.test.mjs \
            lsa-essential-e1-candidate/tests/streaming-decision.test.mjs \
            lsa-essential-e1-candidate/tests/reliability.test.mjs \
            lsa-essential-e1-candidate/tests/observability.test.mjs \
            lsa-essential-e1-candidate/tests/activities-act6.test.mjs \
            lsa-essential-e1-candidate/tests/p2-editor.test.mjs \
            lsa-essential-e1-candidate/tests/activities-act5.test.mjs \
            lsa-essential-e1-candidate/tests/activities-act3.test.mjs \
            lsa-essential-e1-candidate/tests/activities-act2.test.mjs \
            lsa-essential-e1-candidate/tests/activity-act4.test.mjs \
            lsa-essential-e1-candidate/tests/activities-contract.test.mjs
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native StepRunner owner/adapter/contract regression
        run: dotnet run --project native/activities/tests/ActivityTests.csproj --configuration Release
      - name: ACT3–ACT5 promoted runtime regression
        run: dotnet run --project native/promoted-characters/runtime-tests/RuntimeTests.csproj --configuration Release
  genuine-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual promoted GTA runtime against pinned RPH + Essential SDK
        run: node tools/native-sdk/compileProductionNative.mjs
