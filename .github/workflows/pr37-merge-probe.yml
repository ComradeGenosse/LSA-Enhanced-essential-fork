name: PR37 Merge Candidate Validation
on:
  push:
    branches: [feature/c01-source-time-utterance-lifecycle]
    paths: [.github/workflows/pr37-merge-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c01-source-time-utterance-lifecycle
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge main into candidate without changing remote
        shell: bash
        run: |
          git config user.name 'LSA Integration Candidate'
          git config user.email 'integration-candidate@users.noreply.github.com'
          git fetch origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          git merge --no-commit --no-ff -X ours origin/main
          test -z "$(git ls-files -u)"
          git diff --check
          echo '=== MERGE CANDIDATE READY ==='
          git status --short | tail -25
      - name: Resolve duplicate C01/main contract imports in candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lsa-essential-e1-candidate/src/perception/contracts.mjs')
          s=p.read_text()
          main="import {readProtagonistFrame,PROTAGONIST_EVENT} from './protagonistProtocol.mjs';"
          pr="import { readProtagonistFrame, PROTAGONIST_EVENT } from './protagonistProtocol.mjs';"
          if main in s and pr in s:
              s=s.replace(pr+'\\n','')
              p.write_text(s)
          PY
          sed -n '1,18p' lsa-essential-e1-candidate/src/perception/contracts.mjs
          node --check lsa-essential-e1-candidate/src/perception/contracts.mjs
      - name: C01 focused and cross-system Node regression
        shell: bash
        working-directory: lsa-essential-e1-candidate
        run: |
          node --test tests/c01-proximity.test.mjs tests/c01-utterance-lifecycle.test.mjs
          node tools/runTests.mjs
      - name: Native production reference build
        shell: bash
        run: node tools/native-sdk/compileProductionNative.mjs
      - name: Isolated offline verification
        shell: bash
        env:
          LSA_CI_FAILURE_DETAILS: '1'
        run: python tools/isolated-offline-tests/run.py "$GITHUB_WORKSPACE/lsa-essential-e1-candidate"
      - name: Companion build
        working-directory: lsa-essential-e1-candidate
        shell: bash
        run: node tools/buildCandidate.mjs
