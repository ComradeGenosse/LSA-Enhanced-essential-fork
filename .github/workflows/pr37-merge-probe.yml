name: PR37 Merge Candidate Validation
on:
  push:
    branches: [feature/c01-source-time-utterance-lifecycle]
    paths: [.github/workflows/pr37-merge-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/c01-source-time-utterance-lifecycle
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge main into candidate without changing remote
        shell: bash
        run: |
          git config user.name 'LSA Integration Candidate'
          git config user.email 'integration-candidate@users.noreply.github.com'
          git fetch origin main
          echo "HEAD=$(git rev-parse HEAD)"
          echo "MAIN=$(git rev-parse origin/main)"
          git merge --no-commit --no-ff -X ours origin/main
          test -z "$(git ls-files -u)"
          git diff --check
          echo '=== MERGE CANDIDATE READY ==='
          git status --short | tail -25
      - name: Resolve duplicate C01/main contract imports in candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lsa-essential-e1-candidate/src/perception/contracts.mjs')
          s=p.read_text()
          main="import {readProtagonistFrame,PROTAGONIST_EVENT} from './protagonistProtocol.mjs';"
          pr="import { readProtagonistFrame, PROTAGONIST_EVENT } from './protagonistProtocol.mjs';"
          if main in s and pr in s:
              s=s.replace(pr,'')
              p.write_text(s)
          q=Path('lsa-essential-e1-candidate/src/perception/shadowRuntime.mjs')
          runtime=q.read_text()
          old="  constructor({ mode='off', radio='off', radioCatalog=RadioTrackTextCatalog.unavailable(), now=()=>Math.floor(performance.now()), situationFor=()=>({}), trace=null, stall=null }={}) {"
          new="  constructor({ mode='off', radio='off', radioCatalog=null, ambientSpeech=false, now=()=>Math.floor(performance.now()), situationFor=()=>({}), acceptedObservationTap=null, consumers=null, m9Events=null, trace=null, stall=null }={}) {"
          if old not in runtime:
              raise RuntimeError('unexpected C01 constructor signature')
          runtime=runtime.replace(old,new)
          runtime=runtime.replace('this.radioCatalog=radioCatalog??RadioTrackTextCatalog.unavailable();','this.radioCatalog=null;',1)
          start=runtime.index('    this.observations=new ObservationStore(')
          end=runtime.index('    this.ps2Diagnostics=',start)
          newblock=[
            '    this.consumerActivation=consumers;',
            "    const ps2=mode==='shadow'&&(consumers===null||consumers.ps2?.enabled===true);",
            "    const ps3=ps2&&(consumers===null||consumers.ps3?.enabled===true);",
            '    this.radioCatalog=ps2?(radioCatalog??RadioTrackTextCatalog.unavailable()):null;',
            '    this.observations=ps2?new ObservationStore({now,current:ref=>this.current(ref)}):null;',
            '    this.episodes=ps2?new EpisodeStore({now,current:ref=>this.current(ref)}):null;',
            '    this.correlator=ps2?new EpisodeCorrelator({episodes:this.episodes,observations:this.observations,now,current:ref=>this.current(ref),anchor:ref=>this.anchors.get(ref)}):null;',
            '    this.transcripts=ps2?new SharedTranscriptStore({now,current:ref=>this.current(ref)}):null;',
            '    this.utterances=ps2?new UtteranceLifecycle({now,current:ref=>this.current(ref)}):null;',
            '    this.speechRights=new Map();',
            '    this.speechDiagnostics={receipts:0,accepted:0,observations:0,rejected:0};',
            '    this.salience=ps3?new SalienceCache({now,ambientSpeech}):null;'
          ]
          runtime=runtime[:start]+chr(10).join(newblock)+chr(10)+runtime[end:]
          q.write_text(runtime)
          # Retain the latest main native compile inventory plus C01.
          from subprocess import check_output
          project=Path('native/promoted-characters/PromotedCharacters.csproj')
          main_project=check_output(['git','show','origin/main:native/promoted-characters/PromotedCharacters.csproj'],text=True)
          if 'SpeechCaptureAdapter.cs' not in main_project:
              needle='NpcPlaybackStateProbe.cs'
              if needle not in main_project:
                  raise RuntimeError('native project structure changed; review required')
              main_project=main_project.replace(needle,needle+';SpeechCaptureAdapter.cs',1)
          project.write_text(main_project)
          entry=Path('native/promoted-characters/RuntimeEntry.cs')
          modern=check_output(['git','show','origin/main:native/promoted-characters/RuntimeEntry.cs'],text=True)
          anchor='                            integration.OwnerRetired+=intelligence.OwnerRetired;'
          if anchor not in modern: raise RuntimeError('native runtime owner anchor changed')
          modern=modern.replace(anchor,
              '                            if(config.intelligence.captureMode=="shadow") intelligence.EnableCaptureShadow();'+chr(10)+
              '                            else if(config.intelligence.captureMode=="experimental") intelligence.EnableCaptureExperimental();'+chr(10)+anchor,1)
          old='public string directorMode {get;set;}="off";'
          if old not in modern: raise RuntimeError('native runtime intelligence config changed')
          modern=modern.replace(old,old+'public string captureMode {get;set;}="off";',1)
          entry.write_text(modern)
          # The modern context prompt contains new action, memory and UX rules.
          rules=Path('lsa-essential-e1-candidate/src/context/knowledgeInstructions.mjs')
          modern_rules=check_output(['git','show','origin/main:lsa-essential-e1-candidate/src/context/knowledgeInstructions.mjs'],text=True)
          anchor='Missing or unknown values remain unknown.'
          if anchor not in modern_rules: raise RuntimeError('grounding rule contract changed')
          modern_rules=modern_rules.replace(anchor,
              'An overheard_player_words claim is an individually authorized source-time player quote, not proof its claims are true or evidence of the addressed listener. Presence-only speech is never a word-for-word quote. '+anchor,1)
          rules.write_text(modern_rules)
          # Retain main's optional consumer gating, lifecycle and social-scene state.
          runtime=q.read_text()
          s='this.directorReceipts=[];this.situationProvider=situationFor;'
          if s in runtime:
              runtime=runtime.replace(s,'this.directorReceipts=[];this.socialManualResult=null;this.socialScenes=new Map();this.socialDiagnostics={accepted:0,replayed:0,stale:0,manualAccepted:0,manualRejected:0};this.situationProvider=situationFor;',1)
          if 'this.socialScenes=new Map()' not in runtime: raise RuntimeError('social state integration failed')
          for field in ['salience','observations','episodes','correlator','transcripts','utterances']:
              runtime=runtime.replace('this.'+field+'.','this.'+field+'?.')
          q.write_text(runtime)
          # Preserve the actual current ShadowRuntime methods (Memory K, M3, M9,
          # Director, Observability); port only C01's independent functionality.
          native_path='lsa-essential-e1-candidate/src/perception/shadowRuntime.mjs'
          src=check_output(['git','show','HEAD:'+native_path],text=True)
          runtime=check_output(['git','show','origin/main:'+native_path],text=True)
          def insert_once(needle,new):
              global runtime
              if runtime.count(needle)<1: raise RuntimeError('C01 merge anchor unexpectedly changed: '+needle[:80])
              runtime=runtime.replace(needle,new,1)
          import_start="import { UtteranceLifecycle } from './utteranceLifecycle.mjs';"
          import_end="import {publishSpeechObservations} from './speechEvents.mjs';"
          imports=src[src.index(import_start):src.index(import_end)+len(import_end)]
          insert_once("import { SharedTranscriptStore } from './sharedTranscriptStore.mjs';",
              "import { SharedTranscriptStore } from './sharedTranscriptStore.mjs';"+chr(10)+imports)
          insert_once('this.directorRequestVersion=null;this.directorPriority=null',
              'this.directorRequestVersion=null;this.utteranceLifecycleVersion=null;this.directorPriority=null')
          insert_once('    this.transcripts=ps2?new SharedTranscriptStore({now,current:ref=>this.current(ref)}):null;',
              '    this.transcripts=ps2?new SharedTranscriptStore({now,current:ref=>this.current(ref)}):null;'+chr(10)+
              '    this.utterances=ps2?new UtteranceLifecycle({now,current:ref=>this.current(ref)}):null;'+chr(10)+
              '    this.speechRights=new Map();'+chr(10)+
              '    this.speechDiagnostics={receipts:0,accepted:0,observations:0,rejected:0};')
          insert_once('this.directorRequestVersion=null;this.directorPriority=null;this.directorReceipts=[];this.socialManualResult=null',
              'this.directorRequestVersion=null;this.utteranceLifecycleVersion=null;this.directorPriority=null;this.directorReceipts=[];this.socialManualResult=null')
          insert_once('this.transcripts?.setActiveRun(null);this.epoch=null;',
              'this.transcripts?.setActiveRun(null);this.utterances?.clear();this.speechRights.clear();this.epoch=null;')
          insert_once('    this.observations?.expire();'+chr(10)+'    this.episodes?.expire();',
              '    for(const [id,right] of this.speechRights)'+chr(10)+
              '      if(right.expires<=this.now() || !this.current(right.observerRef)) this.speechRights.delete(id);'+chr(10)+
              '    this.observations?.expire();'+chr(10)+'    this.episodes?.expire();')
          insert_once('this.directorRequestVersion=v.directorRequestVersion??null;this.capabilities=',
              'this.directorRequestVersion=v.directorRequestVersion??null;this.utteranceLifecycleVersion=v.utteranceLifecycleVersion??null;this.capabilities=')
          insert_once('directorRequestVersion=this.directorRequestVersion;'+chr(10)+"      this.reset('manual');",
              'directorRequestVersion=this.directorRequestVersion,utteranceLifecycleVersion=this.utteranceLifecycleVersion;'+chr(10)+"      this.reset('manual');")
          insert_once('this.directorRequestVersion=directorRequestVersion;this.directorPriority=null',
              'this.directorRequestVersion=directorRequestVersion;this.utteranceLifecycleVersion=utteranceLifecycleVersion;this.directorPriority=null')
          start=src.index("    if(v.type==='utterance') {")
          end=src.index("    if(v.type==='director_priority') {",start)
          cases=src[start:end].replace('this.utterances.accept(', 'this.utterances?.accept(')
          insert_once("    if(v.type==='director_priority') {",cases+"    if(v.type==='director_priority') {")
          start=src.index('  commitQualifiedSpeech(utteranceId) {')
          end=src.index('  acceptPlayerTranscript(',start)
          methods=src[start:end]
          methods=methods.replace('const entry=this.utterances.entries.get(utteranceId);',
                 'const entry=this.utterances?.entries.get(utteranceId);')
          methods=methods.replace('const right=this.speechRights.get(observationId);',
                 'const right=this.speechRights.get(observationId);')
          insert_once('  acceptPlayerTranscript({text,receipt=null}={}) {',methods+'  acceptPlayerTranscript({text,receipt=null}={}) {')
          q.write_text(runtime)
          # Preserve the latest authenticated native-intelligence/Memory K client.
          client_path='lsa-essential-e1-candidate/src/perception/intelligenceClient.mjs'
          oldclient=check_output(['git','show','HEAD:'+client_path],text=True)
          client=check_output(['git','show','origin/main:'+client_path],text=True)
          start=oldclient.index('  recordTypedUtterance(identity) {')
          end=oldclient.index('  // Preview-only in v1.0',start)
          insert=oldclient[start:end].replace('this.runtime.utterances.','this.runtime.utterances?.')
          exact='  acceptPlayerTranscript(input) {return this.runtime.acceptPlayerTranscript(input);}'
          if client.count(exact)!=1: raise RuntimeError('intelligence client C01 API anchor changed')
          client=client.replace(exact,exact+chr(10)+insert,1)
          diag=("      c01:{...(this.runtime.utterances?.diagnostics??{}),"+chr(10)+
               "        ...this.runtime.speechDiagnostics,"+chr(10)+
               "        enabled:this.runtime.utteranceLifecycleVersion===1,"+chr(10)+
               "        proximityEnabled:this.runtime.capabilities.playerSpeech===true},"+chr(10))
          marker='      ps3:{...this.runtime.ps3Diagnostics,'
          if client.count(marker)!=1: raise RuntimeError('intelligence diagnostics anchor changed')
          client=client.replace(marker,diag+marker,1)
          client=client.replace("'m9_sample','signal','diagnostics'];",
              "'m9_sample','signal','diagnostics','utterance','speech_receipt'];",1)
          Path(client_path).write_text(client)
          # Restore newer UX4/pinned-audio callback handling in the OpenAI session.
          ai_path='lsa-essential-e1-candidate/src/openai/openaiConnection.mjs'
          ai=check_output(['git','show','origin/main:'+ai_path],text=True)
          ai=ai.replace('\\r\\n','\\n')
          old='    return Promise.resolve(this.#launch({ input: this.#turn.inputText || String(text || \'\').trim() }));'
          new="""    const input = this.#turn.inputText || String(text || '').trim();
              const launched = this.#launch({input});
              if(launched && this.#turn.source==='player_text' && input.trim()) {
                try {this.#runtime.intelligence?.recordTypedUtterance?.(this.#turn.identity);} catch {}
              }
              return Promise.resolve(launched);"""
          if ai.count(old)!=1: raise RuntimeError('OpenAI typed input anchor changed')
          ai=ai.replace(old,new,1)
          old='    this.#micOverflow = false;'+chr(10)+"    this.#voice('captureStarted'"
          new="""    this.#micOverflow = false;
              try {this.#runtime.intelligence?.reserveMicUtterance?.({
                identity:this.#turn.identity,
                actorRef:this.#turn.knowledgeInputs?.association?.captureRef,
                utteranceId:this.#turn.knowledgeInputs?.micUtteranceId,
                hostRunId:this.#turn.knowledgeInputs?.hostRunId,
                worldEpoch:this.#turn.knowledgeInputs?.worldEpoch
              });} catch {}
              this.#voice('captureStarted'"""
          if ai.count(old)!=1: raise RuntimeError('OpenAI mic start anchor changed')
          ai=ai.replace(old,new,1)
          old="    this.#voice('captureEnded', this.#turn.identity, { submitted: true });"
          if ai.count(old)!=1: raise RuntimeError('OpenAI mic finish anchor changed')
          ai=ai.replace(old,"    try {this.#runtime.intelligence?.finishMicUtterance?.(this.#turn.identity,pcm.length);} catch {}"+chr(10)+old,1)
          old="    this.#retired = true;"
          if ai.count(old)!=1: raise RuntimeError('OpenAI cancellation anchor changed')
          ai=ai.replace(old,old+chr(10)+"    try {this.#runtime.intelligence?.cancelMicUtterance?.(identity);} catch {}",1)
          Path(ai_path).write_text(ai)
          # Preserve the latest M3/M9/Memory K frame contracts; admit C01
          # frames with the original C01 validation functions.
          contract_path='lsa-essential-e1-candidate/src/perception/contracts.mjs'
          contract=check_output(['git','show','origin/main:'+contract_path],text=True)
          needle="import { validateHostEnvelope, validateWorldEpoch } from '../context/hostContext.mjs';"
          insert=("import { validateUtteranceFact } from './utteranceLifecycle.mjs';"+chr(10)+
                 "import {validateSpeechReceiptV2Shape} from './speechReceiptV2.mjs';"+chr(10))
          if contract.count(needle)!=1: raise RuntimeError('modern host contract import anchor changed')
          contract=contract.replace(needle,insert+needle,1)
          needle="...(Object.hasOwn(v,'directorRequestVersion') ? ['directorRequestVersion'] : [])"
          if contract.count(needle)!=1: raise RuntimeError('modern hello versions contract changed')
          contract=contract.replace(needle,needle+",...(Object.hasOwn(v,'utteranceLifecycleVersion') ? ['utteranceLifecycleVersion'] : [])",1)
          needle="&& v.version===1 && isUuid(v.adapterEpoch)"
          if contract.count(needle)!=1: raise RuntimeError('modern hello version gating changed')
          contract=contract.replace(needle,"&& (!Object.hasOwn(v,'utteranceLifecycleVersion') || v.hostContextVersion===1 && v.utteranceLifecycleVersion===1) "+needle,1)
          needle="  if (v.type==='signal') return validateSignal(v.payload);"
          if contract.count(needle)!=1: raise RuntimeError('modern contract signal dispatch changed')
          contract=contract.replace(needle,
              "  if (v.type==='utterance') return validateUtteranceFact(v.payload);"+chr(10)+
              "  if (v.type==='speech_receipt') return validateSpeechReceiptV2Shape(v.payload);"+chr(10)+needle,1)
          Path(contract_path).write_text(contract)
          # Keep the current M9/Memory K/native-owner implementation and
          # port only the native C01 speech capture additions.
          ch_path='native/intelligence/IntelligenceChannel.cs'
          ch=check_output(['git','show','origin/main:'+ch_path],text=True)
          old='readonly bool observerIndex,directorRequests,currentOwnerPlayer,m9Sample;'
          assert ch.count(old)==1
          ch=ch.replace(old,'readonly bool observerIndex,directorRequests,currentOwnerPlayer,m9Sample,utteranceLifecycle;',1)
          old='bool currentOwnerPlayer=false,bool m9Sample=false)'
          assert ch.count(old)==1
          ch=ch.replace(old,'bool currentOwnerPlayer=false,bool m9Sample=false,bool utteranceLifecycle=false)',1)
          old='this.m9Sample=m9Sample;'
          assert ch.count(old)==1
          ch=ch.replace(old,old+'this.utteranceLifecycle=utteranceLifecycle;',1)
          old='            return value;'
          assert ch.count(old)==1
          ch=ch.replace(old,'            if(utteranceLifecycle && hostRunId!=null)value["utteranceLifecycleVersion"]=1;'+chr(10)+old,1)
          Path(ch_path).write_text(ch)
          native_path='native/intelligence/IntelligenceIntegration.cs'
          original=check_output(['git','show','HEAD:'+native_path],text=True)
          modern=check_output(['git','show','origin/main:'+native_path],text=True)
          start=original.index('        LSA.PromotedCharacters.SpeechCaptureAdapter speechCapture;')
          end=original.index('        IntelligenceChannel channel;',start)
          speech=original[start:end]
          old='        EssentialMicState directorMic;'
          assert modern.count(old)==1
          modern=modern.replace(old,old+chr(10)+speech,1)
          old='        void WorldChanged(int epoch,string reason) {'+chr(10)
          assert modern.count(old)==1
          modern=modern.replace(old,old+'            speechCapture?.Reset();speechWindow=null;'+chr(10),1)
          old='memoryCurrentOwnerPlayerSample!=null,M9Compiled&&producerPolicy.M9);channel.Start();'
          assert modern.count(old)==2
          modern=modern.replace(old,'memoryCurrentOwnerPlayerSample!=null,M9Compiled&&producerPolicy.M9,speechCapture!=null);channel.Start();')
          old='                InitializeProducerAdapters();'+chr(10)
          assert modern.count(old)==1
          modern=modern.replace(old,old+(
              '                if(captureShadow) speechCapture=LSA.PromotedCharacters.SpeechCaptureAdapter.Attach(host);'+chr(10)+
              '                if(proximityExperimental && speechCapture!=null) capabilities["playerSpeech"]=true;'+chr(10)),1)
          start=original.index('                // Drain C-01 only after')
          end=original.index('                DrainDirectorCorePlayback();',start)
          speech_update=original[start:end]
          old='                DrainDirectorCorePlayback();'
          assert modern.count(old)==1
          modern=modern.replace(old,speech_update+old,1)
          old='                var association=Association(anchor);'
          assert modern.count(old)==1
          modern=modern.replace(old,(
              '                var exactMic=speechCapture?.ActiveIdFor(ped);'+chr(10)+
              '                if(exactMic!=null)block["micUtteranceId"]=exactMic;'+chr(10)+old),1)
          old='            if(stopped) return;shutdownReason=reason;stopped=true;sensors.Enabled=false;protagonistSensor.Revoke();'
          assert modern.count(old)==1
          modern=modern.replace(old,old+chr(10)+'            speechCapture?.Detach();speechCapture=null;',1)
          Path(native_path).write_text(modern)
          PY
          sed -n '1,18p' lsa-essential-e1-candidate/src/perception/contracts.mjs
          node --check lsa-essential-e1-candidate/src/perception/contracts.mjs
      - name: C01 focused and cross-system Node regression
        shell: bash
        working-directory: lsa-essential-e1-candidate
        run: |
          node --test tests/c01-proximity.test.mjs tests/c01-utterance-lifecycle.test.mjs
      - name: Full inventoried essential suite (independent gate)
        continue-on-error: true
        working-directory: lsa-essential-e1-candidate
        shell: bash
        run: node tools/runTests.mjs
      - name: Focused UX4 Director Memory K perception compatibility (independent gate)
        working-directory: lsa-essential-e1-candidate
        continue-on-error: true
        shell: bash
        run: node --test tests/perception-contract.test.mjs tests/m3-ws5b-production.test.mjs tests/memory-g-independent-events.test.mjs tests/activities-act5.test.mjs
      - name: Native lifecycle and test defaults from current main baseline
        continue-on-error: true
        shell: bash
        run: |
          git worktree add --detach /tmp/lsa-pr37-baseline origin/main
          cd /tmp/lsa-pr37-baseline/lsa-essential-e1-candidate
          node --test tests/native-lifecycle.test.mjs tests/personal-test-defaults.test.mjs
      - name: Native lifecycle and test defaults from candidate
        continue-on-error: true
        shell: bash
        working-directory: lsa-essential-e1-candidate
        run: node --test tests/native-lifecycle.test.mjs tests/personal-test-defaults.test.mjs
      - name: Native production reference build
        shell: bash
        run: node tools/native-sdk/compileProductionNative.mjs
      - name: Isolated offline verification
        continue-on-error: true
        shell: bash
        env:
          LSA_CI_FAILURE_DETAILS: '1'
        run: python tools/isolated-offline-tests/run.py "$GITHUB_WORKSPACE/lsa-essential-e1-candidate"
      - name: Companion build
        working-directory: lsa-essential-e1-candidate
        shell: bash
        run: node tools/buildCandidate.mjs
