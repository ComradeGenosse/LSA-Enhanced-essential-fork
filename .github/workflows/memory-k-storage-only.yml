name: Memory K E1 storage-only (C prerequisite preview)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [integration/memory-k-production-20261012]
    paths:
      - 'lsa-essential-e1-candidate/**'
      - 'lsa-shared-brain/**'
      - 'tools/memory-k-verification/registrations/storage-only.json'
      - '.github/workflows/memory-k-storage-only.yml'
  workflow_dispatch:
permissions:
  contents: read
# Supersede old runs for this workflow and PR without cancelling other checks.
concurrency:
  group: memory-k-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  storage-only:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MEMORY_K_C_PREREQUISITE: f596c2890ec25540a7258e7853c30ef9d28dca41
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Standalone profile contract and fail-closed pre-C behavior
        run: node --test lsa-essential-e1-candidate/tests/memory-storage-only-contract.test.mjs lsa-essential-e1-candidate/tests/memory-capability-policy.test.mjs
      - name: Construct reviewed prerequisite preview without updating any branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/memory-k-storage-only"
          git rev-parse HEAD > "$RUNNER_TEMP/memory-k-storage-only/e1-head.txt"
          git fetch origin "$MEMORY_K_C_PREREQUISITE"
          git -c user.name='Memory K verification' -c user.email='memory-k-verification@users.noreply.github.com' merge --no-edit "$MEMORY_K_C_PREREQUISITE"
          git rev-parse HEAD > "$RUNNER_TEMP/memory-k-storage-only/combined-head.txt"
          git status --porcelain > "$RUNNER_TEMP/memory-k-storage-only/source-status.txt"
      - name: Real SQLite, migration, editor, isolation and lifecycle regression (offline)
        shell: bash
        run: |
          node --test --test-reporter=tap --test-concurrency=1 lsa-essential-e1-candidate/tests/memory-storage-only-contract.test.mjs lsa-essential-e1-candidate/tests/memory-storage-only-activation.test.mjs lsa-essential-e1-candidate/tests/memory-runtime-composition.test.mjs lsa-essential-e1-candidate/tests/memory-capability-policy.test.mjs lsa-essential-e1-candidate/tests/m1-sqlite-foundation.test.mjs lsa-essential-e1-candidate/tests/m1-shared-memory-parity.test.mjs lsa-shared-brain/tests/memory-k-ws4b-durability.test.mjs lsa-shared-brain/tests/memory-k-ws4b-review.test.mjs | tee "$RUNNER_TEMP/memory-k-storage-only/tests.log"
      - name: Isolated original package build (not native/GTA acceptance)
        run: node lsa-essential-e1-candidate/tools/buildCandidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-k-storage-only-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/memory-k-storage-only
