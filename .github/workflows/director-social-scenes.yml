name: Director social scenes — focused validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/intelligence/**'
      - 'native/promoted-characters/**'
      - 'lsa-essential-e1-candidate/src/perception/**'
      - 'lsa-essential-e1-candidate/src/bootstrap.mjs'
      - 'lsa-essential-e1-candidate/tests/director-social-scenes.test.mjs'
      - '.github/workflows/director-social-scenes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Director syntax checks
        run: |
          node --check lsa-essential-e1-candidate/src/perception/directorProduction.mjs
          node --check lsa-essential-e1-candidate/src/perception/shadowRuntime.mjs
          node --check lsa-essential-e1-candidate/src/perception/directorSocialContext.mjs
          node --check lsa-essential-e1-candidate/src/perception/sceneDirectorOrchestrator.mjs
      - name: Social + existing reactive Director regressions
        run: node --test lsa-essential-e1-candidate/tests/director-social-scenes.test.mjs lsa-essential-e1-candidate/tests/director-production.test.mjs lsa-essential-e1-candidate/tests/director-orchestrator.test.mjs lsa-essential-e1-candidate/tests/director-wire.test.mjs lsa-essential-e1-candidate/tests/director-transport.test.mjs lsa-essential-e1-candidate/tests/ps6-phase13a-reliability.test.mjs
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build pinned production native add-on
        run: node tools/native-sdk/compileProductionNative.mjs
      - name: Native Director and integration contract tests
        shell: pwsh
        run: |
          dotnet build native/intelligence/director-tests/DirectorTests.csproj --configuration Debug
          & .\native\intelligence\director-tests\bin\Debug\net481\DirectorTests.exe
          dotnet build native/intelligence/integration-tests/IntegrationTests.csproj --configuration Debug
          & .\native\intelligence\integration-tests\bin\Debug\net481\IntegrationTests.exe
