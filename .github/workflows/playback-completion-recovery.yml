name: Playback Completion Recovery Verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'lsa-essential-e1-candidate/src/openai/**'
      - 'lsa-essential-e1-candidate/src/integration/**'
      - 'lsa-essential-e1-candidate/src/config/**'
      - 'lsa-essential-e1-candidate/src/observability/**'
      - 'lsa-essential-e1-candidate/tests/native-lifecycle.test.mjs'
      - 'lsa-essential-e1-candidate/tests/playback-completion-recovery.test.mjs'
      - 'lsa-essential-e1-candidate/tools/buildCandidate.mjs'
      - '.github/workflows/playback-completion-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse changed runtime modules
        run: |
          node --check lsa-essential-e1-candidate/src/openai/runSequentialTurn.mjs
          node --check lsa-essential-e1-candidate/src/openai/playbackCompletionPolicy.mjs
          node --check lsa-essential-e1-candidate/tools/buildCandidate.mjs
      - name: Audio, history, playback and native event regression suite
        working-directory: lsa-essential-e1-candidate
        run: |
          node --test tests/playback-completion-recovery.test.mjs tests/native-lifecycle.test.mjs tests/tts-and-history.test.mjs tests/npc-speech-stream-ledger.test.mjs tests/ea2-turn-lifecycle.test.mjs tests/elevenlabs-main-integration.test.mjs tests/elevenlabs-provider.test.mjs tests/director-playback.test.mjs
      - name: Build production Essential bundle with pinned source contracts
        working-directory: lsa-essential-e1-candidate
        run: node tools/buildCandidate.mjs
  native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile production promoted-character DLL against pinned Essential and RPH SDKs
        run: node tools/native-sdk/compileProductionNative.mjs
