name: Physics GT0 offline ground truth

on:
  workflow_dispatch:
  push:
    branches:
      - feature/physics-gt0-offline-ground-truth-20261019
    paths:
      - '.github/workflows/physics-gt0-offline.yml'
      - 'native/physics-e0/ground-truth/**'
      - 'native/physics-e0/research/verified-material-catalog.schema.json'
  pull_request:
    paths:
      - '.github/workflows/physics-gt0-offline.yml'
      - 'native/physics-e0/ground-truth/**'
      - 'native/physics-e0/research/verified-material-catalog.schema.json'

permissions:
  contents: read

jobs:
  offline-gt0:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Compile source
        run: python -m compileall -q native/physics-e0/ground-truth
      - name: Run synthetic-only offline regression tests
        run: python -m unittest discover -s native/physics-e0/ground-truth/tests -p 'test_*.py' -v
      - name: Reject confidential/private research files tracked by Git
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z native/physics-e0/ground-truth | python -c '
          import sys
          paths=[p.decode() for p in sys.stdin.buffer.read().split(b"\0") if p]
          forbidden=(".private.json", ".ybn", ".ymap", ".ytyp", ".rpf", ".zip", ".png", ".jpg", ".jpeg", ".xml")
          mistakes=[p for p in paths if p.lower().endswith(forbidden)]
          if mistakes:
              print("Forbidden research files tracked:", mistakes)
              sys.exit(1)
          print("GT0 tracked research sources passed file-scope check")
          '
