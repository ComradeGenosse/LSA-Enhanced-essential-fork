name: Native demographics audit
on:
  push:
    branches:
      - audit/native-demographics-20261002

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Fingerprint pinned inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p audit-output
          sha256sum lsa-essential-e1-candidate/upstream/LosSantosAlive.dll | tee audit-output/dll.sha256
          sha256sum lsa-essential-e1-candidate/upstream/server.bundle.mjs | tee audit-output/server.sha256
      - name: Install ILSpy command line
        shell: bash
        run: |
          set -euxo pipefail
          dotnet tool install ilspycmd --tool-path .audit-tools
          .audit-tools/ilspycmd --version | tee audit-output/ilspy-version.txt
      - name: Extract strings
        shell: bash
        run: |
          set -euxo pipefail
          DLL=lsa-essential-e1-candidate/upstream/LosSantosAlive.dll
          strings -a -n 3 "$DLL" > audit-output/strings-ascii.txt
          strings -a -el -n 3 "$DLL" > audit-output/strings-utf16le.txt
          grep -Ein 'age|gender|male|female|young|adult|middle|older|senior|elder|archetype|hydration|integration|birthday|modelAge|pedId|voice' audit-output/strings-ascii.txt > audit-output/strings-relevant-ascii.txt || true
          grep -Ein 'age|gender|male|female|young|adult|middle|older|senior|elder|archetype|hydration|integration|birthday|modelAge|pedId|voice' audit-output/strings-utf16le.txt > audit-output/strings-relevant-utf16le.txt || true
      - name: Decompile target types
        shell: bash
        run: |
          set -euxo pipefail
          DLL=lsa-essential-e1-candidate/upstream/LosSantosAlive.dll
          IL=.audit-tools/ilspycmd
          $IL -l c "$DLL" > audit-output/types.txt
          types=(
            'LosSantosAlive.Context.Providers.ActorContextProvider'
            'LosSantosAlive.Context.ActorHydrationCoordinator'
            'LosSantosAlive.Context.ConversationHydrationCoordinator'
            'LosSantosAlive.Context.GeminiContextBuilder'
            'LosSantosAlive.Context.ContextJsonSerializer'
            'LosSantosAlive.Context.ContextSnapshot'
            'LosSantosAlive.Context.ActorContext'
            'LosSantosAlive.Integrations.IntegrationManager'
            'LosSantosAlive.Integrations.IIntegration'
            'LosSantosAlive.Integrations.PolicingRedefinedBridge.PolicingRedefinedPipeClient'
            'LosSantosAlive.NPC.NpcStateStore'
            'LosSantosAlive.NPC.Memory.PedContinuityMemoryService'
          )
          i=0
          for type in "${types[@]}"; do
            safe=$(printf '%s' "$type" | tr '.+<>/' '_____')
            $IL -t "$type" "$DLL" > "audit-output/${safe}.cs" 2> "audit-output/${safe}.cs.err" || true
            $IL -il -t "$type" "$DLL" > "audit-output/${safe}.il" 2> "audit-output/${safe}.il.err" || true
            i=$((i+1))
          done
          echo "types_attempted=$i" > audit-output/decompile-summary.txt
      - name: Run repository metadata extractor
        shell: bash
        run: |
          set -euxo pipefail
          dotnet run --project lsa-essential-e1-candidate/tools/native-metadata/NativeMetadata.csproj -- lsa-essential-e1-candidate/upstream/LosSantosAlive.dll > audit-output/native-metadata-fresh.json
      - name: Collect integration type names
        shell: bash
        run: |
          set -euxo pipefail
          grep -Ei 'Integration|Context|Hydration|Policing|Lspdfr|ActorContextProvider|Continuity' audit-output/types.txt > audit-output/types-relevant.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: native-demographics-audit
          path: audit-output
          if-no-files-found: error
          retention-days: 2

  decode:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify DLL fingerprint
        shell: pwsh
        run: |
          $hash=(Get-FileHash 'lsa-essential-e1-candidate/upstream/LosSantosAlive.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "sha256=$hash"
          if ($hash -ne '9b6de42d4c464901d859dd95e17e100e4fa9ef6074bfbb0cf3a57a76f6ddd653') { throw "DLL hash mismatch" }
      - name: Build isolated decoder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-decode | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content native-decode/native-decode.csproj
          @'
          using System.Reflection;
          using System.Text.Json;

          static class Program
          {
              static readonly uint[] Tokens = new uint[] {
                  1054968094u,3818300071u,2568606624u,1029827067u,3557421416u,275379809u,
                  1183486338u,4287505268u,1221715181u,3112276658u,3265984749u,
                  3002916032u,1491984142u,3136590273u,3216616699u,543755242u,3823192816u,
                  3921185575u,3452035397u,2752304247u,456850424u,4017991228u,1902598045u,
                  1146829187u
              };
              static string Codepoints(string s) => string.Join(" ", s.Select(ch => $"U+{(int)ch:X4}"));
              static bool Plausible(string s) => s.Length <= 300 && s.All(ch => !char.IsControl(ch) || ch == '\r' || ch == '\n' || ch == '\t');

              public static int Main(string[] args)
              {
                  Directory.CreateDirectory("audit-output");
                  var asm = Assembly.LoadFrom(Path.GetFullPath(args[0]));
                  var moduleType = asm.ManifestModule.GetType("<Module>", false, false);
                  if (moduleType is null) throw new Exception("<Module> type not found.");
                  var candidates = moduleType.GetMethods(BindingFlags.Static|BindingFlags.Public|BindingFlags.NonPublic)
                      .Where(m => m.IsGenericMethodDefinition
                          && m.GetGenericArguments().Length == 1
                          && m.GetParameters().Length == 1
                          && m.GetParameters()[0].ParameterType == typeof(uint))
                      .ToArray();
                  var rows = new List<object>();
                  foreach (var method in candidates)
                  {
                      MethodInfo closed;
                      try { closed = method.MakeGenericMethod(typeof(string)); } catch { continue; }
                      foreach (var token in Tokens)
                      {
                          try
                          {
                              var value = closed.Invoke(null, new object[] { token }) as string;
                              if (value is null || !Plausible(value)) continue;
                              rows.Add(new { methodToken=$"0x{method.MetadataToken:X8}", methodCodepoints=Codepoints(method.Name), token, value });
                          }
                          catch (Exception ex)
                          {
                              var e=ex.GetBaseException();
                              rows.Add(new { methodToken=$"0x{method.MetadataToken:X8}", methodCodepoints=Codepoints(method.Name), token, error=e.GetType().FullName+": "+e.Message });
                          }
                      }
                  }
                  File.WriteAllText("audit-output/decoded-classifier-strings.json", JsonSerializer.Serialize(rows,new JsonSerializerOptions{WriteIndented=true}));
                  Console.WriteLine($"generic_uint_decoders={candidates.Length} rows={rows.Count}");
                  return 0;
              }
          }
          '@ | Set-Content native-decode/Program.cs
          dotnet build native-decode/native-decode.csproj -c Release
      - name: Decode classifier constants
        shell: pwsh
        run: |
          dotnet native-decode/bin/Release/net8.0/native-decode.dll lsa-essential-e1-candidate/upstream/LosSantosAlive.dll
          Get-Content audit-output/decoded-classifier-strings.json | Select-Object -First 400
      - uses: actions/upload-artifact@v4
        with:
          name: native-classifier-string-decode
          path: audit-output/decoded-classifier-strings.json
          if-no-files-found: error
          retention-days: 2
