name: Memory Agent B M3 M9 offline
on:
  push:
    branches: [feature/memory-agent-b-m3-events]
  pull_request:
    paths:
      - 'lsa-shared-brain/src/events/**'
      - 'lsa-essential-e1-candidate/tests/memory-agent-b-events.test.mjs'
      - 'lsa-essential-e1-candidate/tests/memory-agent-b-ps2-tap.test.mjs'
      - 'lsa-essential-e1-candidate/src/perception/shadowRuntime.mjs'
      - '.github/workflows/memory-agent-b-events.yml'
  workflow_dispatch:
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify M3/M9 and existing memory contract
        run: node --test lsa-essential-e1-candidate/tests/memory-agent-b-events.test.mjs lsa-essential-e1-candidate/tests/memory-agent-b-ps2-tap.test.mjs lsa-essential-e1-candidate/tests/memory-contract-v1.test.mjs
