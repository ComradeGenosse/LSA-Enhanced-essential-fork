name: PR37 promoted-only hearing regression (offline; not GTA acoustics)
on:
  pull_request:
    branches: [main]
    paths:
      - 'native/intelligence/IntelligenceIntegration.cs'
      - 'native/intelligence/integration-tests/**'
      - 'lsa-essential-e1-candidate/src/perception/**'
      - 'lsa-essential-e1-candidate/tests/c01-*.test.mjs'
      - 'lsa-essential-e1-candidate/tests/perception-speech.test.mjs'
      - '.github/workflows/pr37-promoted-acoustics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-stt-privacy:
    name: C01 promoted-only witness, STT and private knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse changed authenticated runtime
        run: |
          node --check lsa-essential-e1-candidate/src/perception/shadowRuntime.mjs
          node --check lsa-essential-e1-candidate/src/perception/speechReceiptV2.mjs
          node --check lsa-essential-e1-candidate/src/perception/sharedTranscriptStore.mjs
      - name: Run real C01 and privacy regression sources
        run: node --test lsa-essential-e1-candidate/tests/c01-proximity.test.mjs lsa-essential-e1-candidate/tests/c01-utterance-lifecycle.test.mjs lsa-essential-e1-candidate/tests/perception-speech.test.mjs
  native-acoustics:
    name: C01 native promoted-only sampling policy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile actual production IntelligenceIntegration with strict GTA stubs
        shell: pwsh
        run: |
          dotnet build native/intelligence/integration-tests/IntegrationTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute isolated production C01 sampling and cabin grades
        shell: pwsh
        run: |
          & 'native/intelligence/integration-tests/bin/Release/net481/IntegrationTests.exe' --c01-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
# Genuine pinned native DLL compilation is separately enforced by
# the existing Windows Production net481 DLLs against pinned genuine SDKs job.
# Neither test host runs GTA V Enhanced or validates physical audio DSP.
