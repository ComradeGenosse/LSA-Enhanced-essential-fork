name: VH9 Connected Mesh Synthetic Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/vehicle-deformation/vh9_connected_mesh.py'
      - 'tools/vehicle-deformation/test_vh9_connected_mesh.py'
      - '.github/workflows/vh9-connected-mesh-tests.yml'
  push:
    branches:
      - 'feature/vh9-connected-mesh'
    paths:
      - 'tools/vehicle-deformation/vh9_connected_mesh.py'
      - 'tools/vehicle-deformation/test_vh9_connected_mesh.py'
      - '.github/workflows/vh9-connected-mesh-tests.yml'

jobs:
  synthetic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless pillow
      - run: python -m unittest discover -s tools/vehicle-deformation -p 'test_vh9*.py' -v
